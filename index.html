<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giovanna da Rocha Bragion · Caderno de campo</title>
  <meta name="description" content="Estudante de Oceanografia na USP. Pesquisa com microplásticos, intercâmbio em Tenerife e experiências de campo.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌙</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,400&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=7">
  <script>
    // O site abre sempre no tema claro; o escuro só aparece se a pessoa escolher no botão 🌙
    document.documentElement.dataset.tema = "dia";
    try {
      if (localStorage.getItem("tema") === "noite") document.documentElement.dataset.tema = "noite";
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topo">
    <div class="container">
      <a class="marca" href="#/">
        <svg class="lua" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M21 4a12 12 0 1 0 7 19A10 10 0 0 1 21 4z" fill="currentColor"/>
          <circle cx="25" cy="8" r="1.2" fill="currentColor"/><circle cx="28" cy="13" r=".8" fill="currentColor"/>
        </svg>
        <span id="marca-nome"></span>
      </a>
      <div style="display:flex;gap:8px;align-items:center">
        <nav class="menu" id="menu">
          <a href="#/" data-rota="">Início</a>
          <a href="#/experiencias" data-rota="experiencias">Experiências</a>
          <a href="#/mapa" data-rota="mapa">Mapa</a>
          <a href="#/trajetoria" data-rota="trajetoria">Trajetória</a>
          <a href="#/galeria" data-rota="galeria">Galeria</a>
          <a href="#/sobre" data-rota="sobre">Sobre</a>
        </nav>
        <button class="botao-tema" id="botao-tema" title="Dia / noite" aria-label="Trocar entre dia e noite">🌙</button>
        <button class="botao-menu" id="botao-menu" aria-label="Abrir menu">☰</button>
      </div>
    </div>
  </header>

  <div class="tatuagem" id="tatuagem" aria-hidden="true"></div>
  <main id="app"></main>

  <footer class="rodape">
    <div class="container">
      <span id="rodape-nome"></span>
      <span>⋆.˚𓇼 ⋆.˚ 𓆉 𓆝 𓆡⋆.˚ 𓇼⋆.˚</span>
      <a href="#/admin">Área de edição</a>
    </div>
  </footer>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
    <button class="fechar" aria-label="Fechar">✕</button>
    <button class="ant" aria-label="Foto anterior">‹</button>
    <figure class="polaroid"><img alt=""><figcaption></figcaption></figure>
    <button class="prox" aria-label="Próxima foto">›</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.min.js"></script>
  <script src="js/config.js?v=7"></script>
  <script src="js/data.js?v=7"></script>
  <script src="js/placeholder.js?v=7"></script>
  <script src="js/dados.js?v=7"></script>
  <script src="js/mapa.js?v=7"></script>
  <script src="js/admin.js?v=7"></script>
  <script src="js/app.js?v=7"></script>

</html>
